name: Günlük IPTV Güncelleyici

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v3

      - name: Güncel Listeyi İndir
        run: |
          curl -o KANALLAR.m3u "https://onureroz.com/indirmeler/turk/all.m3u"

      - name: Değişiklikleri Kaydet
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add KANALLAR.m3u
          git commit -m "Otomatik M3U Güncellemesi" || echo "Değişiklik yok"
          git push
