<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MEMOLİ TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome for TV icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- HLS.js for Live Stream (.m3u8) Support -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  /* Koyu Tema Varsayılan Stil */
  body.dark-theme {
    background-color: #080b11;
    color: #f3f4f6;
  }
  body.dark-theme .bg-main { background-color: #080b11; }
  body.dark-theme .bg-card { background-color: #0f172a; }
  body.dark-theme .bg-nav { background-color: rgba(2, 6, 23, 0.95); }
  body.dark-theme .text-main { color: #f3f4f6; }
  body.dark-theme .border-main { border-color: #1e293b; }

  /* Açık Tema Stil */
  body.light-theme {
    background-color: #f1f5f9;
    color: #0f172a;
  }
  body.light-theme .bg-main { background-color: #f1f5f9; }
  body.light-theme .bg-card { background-color: #ffffff; }
  body.light-theme .bg-nav { background-color: rgba(255, 255, 255, 0.95); }
  body.light-theme .text-main { color: #0f172a; }
  body.light-theme .border-main { border-color: #cbd5e1; }
  body.light-theme header { background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%); border-color: #cbd5e1; }
  body.light-theme input { background-color: #ffffff; color: #0f172a; border-color: #94a3b8; }

  /* TV Box İçin Optimize Edilmiş 8'li Sütun Grid Yapısı */
  .tv-grid {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 10px;
  }
  @media (max-width: 1536px) {
    .tv-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  }
  @media (max-width: 1280px) {
    .tv-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  }
  @media (max-width: 768px) {
    .tv-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* Custom TV Remote Focus Styles */
  .tv-card {
    transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    border: 2px solid transparent;
  }
  .tv-card.tv-focused {
    transform: scale(1.06) translateY(-3px);
    border-color: #ef4444 !important;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    z-index: 50;
    outline: none;
  }

  /* BUTON AKTİF EFEKTİ */
  .nav-btn {
    transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .nav-btn.active-btn {
    background-color: #dc2626 !important;
    color: #ffffff !important;
    border-color: #f87171 !important;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    transform: scale(1.04) translateY(-1px);
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #0f172a;
  }
  ::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 3px;
  }
  </style>
</head>
<body class="dark-theme min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white pb-28">

  <!-- Top Navigation & Search Bar -->
  <header class="w-full px-5 py-2.5 sticky top-0 z-40 border-b border-main flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center space-x-3">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6MO0-bC_awFoMRYUUZKnYmbn4lZJrSAdtbBCnbQ9dlw&s=10"
            alt="Bayrak"
            class="w-8 h-8 rounded-lg object-cover shadow-lg shadow-red-600/30 border border-slate-700/80">

        <!-- SAĞINA EKLENEN SAAT ALANI -->
        <span id="liveClock" class="ml-32 px-2.5 py-1 bg-slate-900/90 border-2 border-white text-cyan-400 rounded-lg text-xs font-mono font-bold tracking-widest shadow-[0_0_12px_rgba(255,255,255,0.7)]">
          00:00:00
        </span>

    </div>
    
    <!-- ÜST KISIM ARAMA ÇUBUĞU VE SOLUNDAKİ AÇILIR MENÜ -->

        <button id="dropdownToggleBtn" class="px-3 py-1.5 bg-slate-900/90 border border-slate-700/80 hover:border-red-600 text-white rounded-xl text-[11px] font-black uppercase tracking-wider flex items-center gap-2 transition cursor-pointer">
          <i class="fa-solid fa-bars text-red-500"></i> DİĞERLERİ <i class="fa-solid fa-chevron-down text-[8px] text-slate-400"></i>

        <!-- AÇILIR MENÜ -->
        <div id="dropdownMenu" class="hidden absolute left-0 mt-2 w-48 bg-slate-900 border-2 border-slate-700 rounded-2xl shadow-2xl py-2 z-50 flex flex-col gap-1">

        </div>
      </div>
      
      <!-- Search Input -->
      <div class="relative w-56">

  </header>

  <!-- Main Grid Area -->
  <main class="flex-1 px-4 py-3 max-w-[1920px] mx-auto w-full">

  <!-- OYNATICI MODAL PENCERESİ -->

    <div class="relative w-full max-w-5xl bg-slate-950 border-2 border-red-600/50 rounded-2xl shadow-2xl overflow-hidden flex flex-col">

      <div class="flex items-center justify-between px-4 py-2.5 bg-slate-900 border-b border-slate-800">

        <!-- YouTube / Web İframe Player -->

  <!-- EN ALTTA KATEGORİ VE SAĞ ALTTA AYARLAR BUTONU -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-nav backdrop-blur-md border-t border-main px-8 py-5 shadow-2xl">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <!-- Sol ve Orta Kategori Butonları -->
      <div class="flex items-center gap-2 overflow-x-auto">
        <button class="nav-btn active-btn px-8 py-5 rounded-xl text-xs font-black tracking-wider uppercase bg-slate-900 border border-slate-700 text-slate-200 hover:border-red-500 transition whitespace-nowrap flex items-center gap-1.5 cursor-pointer" data-cat="Tv1">
        📺  TV 1
        </button>
        <button class="nav-btn px-8 py-5 rounded-xl text-xs font-black tracking-wider uppercase bg-slate-900 border border-slate-700 text-slate-200 hover:border-red-500 transition whitespace-nowrap flex items-center gap-1.5 cursor-pointer" data-cat="Tv2">
       📺   TV 2

        <button class="nav-btn px-8 py-5 rounded-xl text-xs font-black tracking-wider uppercase bg-slate-900 border border-slate-700 text-slate-200 hover:border-red-500 transition whitespace-nowrap flex items-center gap-1.5 cursor-pointer" data-cat="Filmler">

        <button class="nav-btn px-8 py-5 rounded-xl text-xs font-black tracking-wider uppercase bg-slate-900 border border-slate-700 text-slate-200 hover:border-red-500 transition whitespace-nowrap flex items-center gap-1.5 cursor-pointer" data-cat="Diziler">
     🎬     DİZİLER

        <button class="nav-btn px-8 py-5 rounded-xl text-xs font-black tracking-wider uppercase bg-slate-900 border border-slate-700 text-slate-200 hover:border-red-500 transition whitespace-nowrap flex items-center gap-1.5 cursor-pointer" data-cat="Radyo">
      📻    RADYO

        <!-- ÖZEL LİSTE KATEGORİSİ -->

       🚦   ÖZEL LİSTE
        </button>

      <!-- SAĞ ALTTAN AYARLAR BUTONU -->

        <i class="">⚙️</i> AYARLAR
      </button>

  <!-- JSON / DOSYA YÜKLEME VE YÖNETME MODAL PENCERESİ -->
  <div id="jsonModalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl text-main max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">

        <button id="closeJsonModalBtn" class="text-slate-400 hover:text-white text-base p-1 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- KATEGORİ SEÇİMİ -->
      <div class="mb-3">
        <label class="block text-[10px] font-bold uppercase tracking-wider text-amber-400 mb-1">Kategori Seç</label>
        <select id="jsonCategorySelect" class="w-full p-2 bg-slate-950 border border-amber-500/50 rounded-lg text-white text-xs focus:outline-none focus:border-red-600">
          <option value="OzelListe">Özel Liste</option>
          <option value="DogaResimleri">Doğa Resimleri</option>
          <option value="DogaVideolari">Doğa Videoları</option>

      </div>
     <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-800"></div>
        <span class="flex-shrink mx-3 text-slate-500 text-[9px] font-bold uppercase">veya JSON metnini yapıştırın</span>
        <div class="flex-grow border-t border-slate-800"></div>
      </div>
      <div class="mb-3">
        <textarea id="jsonInputText" rows="2" placeholder="JSON metnini buraya yapıştırabilirsiniz..." class="w-full p-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:outline-none focus:border-red-600"></textarea>
      </div>
      <div class="flex gap-2 mb-4">
        <button id="saveJsonDataBtn" class="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white font-black text-xs uppercase rounded-lg shadow-lg shadow-red-600/40 transition cursor-pointer">
          LİSTEYE YÜKLE
        </button>
        <button id="clearCustomDbBtn" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-red-400 font-bold text-xs uppercase rounded-lg border border-slate-700 transition cursor-pointer">
          TÜMÜNÜ SİL
        </button>
      </div>

      <!-- TEK TEK SİLME / LİSTE YÖNETİM ALANI -->
      <div class="border-t border-slate-800 pt-3">
        <h4 class="text-xs font-bold text-amber-400 uppercase mb-2">Seçili Kategorideki İçerikler (Tek Tek Sil)</h4>
        <div id="itemListManager" class="max-h-40 overflow-y-auto flex flex-col gap-1.5 bg-slate-950 p-2 rounded-lg border border-slate-800">
          <!-- Dinamik dolacak -->
        </div>
      </div>
    </div>
  </div>

  <!-- AYARLAR MODAL PENCERESİ -->
  <div id="settingsOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-main">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-gear text-amber-400 text-lg"></i>
          <h3 class="text-base font-black uppercase text-white tracking-wide">Uygulama Ayarları</h3>
        </div>
        <button id="closeSettingsBtn" class="text-slate-400 hover:text-white text-base p-1 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <!-- TEMA SEÇİMİ -->
      <div class="mb-4">
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Görünüm Teması</label>
        <div class="grid grid-cols-2 gap-2">
          <button id="themeDarkBtn" class="py-2 px-3 rounded-lg font-black text-xs uppercase border border-red-600 bg-red-600/20 text-white flex items-center justify-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-moon text-xs"></i> KOYU TEMA
          </button>
          <button id="themeLightBtn" class="py-2 px-3 rounded-lg font-black text-xs uppercase border border-slate-700 bg-slate-800 text-slate-300 flex items-center justify-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-sun text-xs"></i> AÇIK TEMA
          </button>
        </div>
      </div>
      <!-- OYNATICI MODU SEÇİMİ (YENİLENEN PLAYER SEÇENEKLERİ) -->
      <div class="mb-5">
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Varsayılan Oynatıcı Tercihi</label>
        <div class="flex flex-col gap-2">
          <button class="player-opt-btn py-2 px-3 rounded-lg font-black text-xs uppercase border border-slate-700 bg-slate-800 text-slate-300 flex items-center justify-between cursor-pointer" data-player="browser">
            <span><i class="fa-solid fa-globe text-xs mr-2"></i> HARİCİ TARAYICI</span>
            <i class="fa-solid fa-circle-check check-icon text-red-500 text-xs hidden"></i>
          </button>
                   <button class="player-opt-btn py-2 px-3 rounded-lg font-black text-xs uppercase border border-red-600 bg-red-600/20 text-white flex items-center justify-between cursor-pointer" data-player="iframe">
            <span><i class="fa-solid fa-window-maximize text-xs mr-2"></i> İFRAME PLAYER</span>
            <i class="fa-solid fa-circle-check check-icon text-red-500 text-xs"></i>
          </button>

          <button class="player-opt-btn py-2 px-3 rounded-lg font-black text-xs uppercase border border-slate-700 bg-slate-800 text-slate-300 flex items-center justify-between cursor-pointer" data-player="hls">
            <span><i class="fa-solid fa-tv text-xs mr-2"></i> CANLI (HLS) PLAYER</span>
            <i class="fa-solid fa-circle-check check-icon text-red-500 text-xs hidden"></i>
          </button>

          <button class="player-opt-btn py-2 px-3 rounded-lg font-black text-xs uppercase border border-slate-700 bg-slate-800 text-slate-300 flex items-center justify-between cursor-pointer" data-player="external">
            <span><i class="fa-solid fa-up-right-from-square text-xs mr-2"></i> HARİCİ PLAYER (APP)</span>
            <i class="fa-solid fa-circle-check check-icon text-red-500 text-xs hidden"></i>
          </button>
        </div>
      </div>
      <button id="saveSettingsBtn" class="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white font-black text-xs uppercase rounded-lg shadow-lg shadow-red-600/40 transition cursor-pointer">
        KAYDET VE UYGULA
      </button>
    </div>
  </div>
  
  <script>
    const savedCustomItems = JSON.parse(localStorage.getItem("memoli_custom_ozel_liste")) || [];
    const savedDogaResim = JSON.parse(localStorage.getItem("memoli_custom_DogaResimleri")) || [];
    const savedDogaVideo = JSON.parse(localStorage.getItem("memoli_custom_DogaVideolari")) || [];
    const savedFilmler = JSON.parse(localStorage.getItem("memoli_custom_Filmler")) || [];
    const savedDiziler = JSON.parse(localStorage.getItem("memoli_custom_Diziler")) || [];

    const database = {
      "Tv1": [],
      "Tv2": [],
      "Filmler": savedFilmler,
      "Diziler": savedDiziler,
      "Radyo": [],
      "DogaResimleri": savedDogaResim,
      "DogaVideolari": savedDogaVideo,
      "OzelListe": savedCustomItems
    };

    const filmGrid = document.getElementById("filmGrid");
    const activeTitle = document.getElementById("activeTitle");
    const searchInput = document.getElementById("searchInput");
    const noResults = document.getElementById("noResults");
    
    const dropdownToggleBtn = document.getElementById("dropdownToggleBtn");
    const dropdownMenu = document.getElementById("dropdownMenu");
    const dropdownItems = document.querySelectorAll(".dropdown-item");
    const openJsonModalBtn = document.getElementById("openJsonModalBtn");
    const jsonModalOverlay = document.getElementById("jsonModalOverlay");
    const closeJsonModalBtn = document.getElementById("closeJsonModalBtn");
    const saveJsonDataBtn = document.getElementById("saveJsonDataBtn");
    const clearCustomDbBtn = document.getElementById("clearCustomDbBtn");
    const jsonInputText = document.getElementById("jsonInputText");
    const jsonFileInput = document.getElementById("jsonFileInput");
    const jsonCategorySelect = document.getElementById("jsonCategorySelect");
    const itemListManager = document.getElementById("itemListManager");

    const settingsBtn = document.getElementById("settingsBtn");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const themeDarkBtn = document.getElementById("themeDarkBtn");
    const themeLightBtn = document.getElementById("themeLightBtn");
    const playerOptBtns = document.querySelectorAll(".player-opt-btn");

    // Player Elementleri
    const playerModalOverlay = document.getElementById("playerModalOverlay");
    const playerModalTitle = document.getElementById("playerModalTitle");
    const closePlayerModalBtn = document.getElementById("closePlayerModalBtn");
    const internalVideoPlayer = document.getElementById("internalVideoPlayer");
    const internalYoutubePlayer = document.getElementById("internalYoutubePlayer");
    let hlsInstance = null;
    
    let currentTheme = localStorage.getItem("memoli_theme") || "dark";
    let currentPlayer = localStorage.getItem("memoli_player") || "browser";
    let currentIndex = 0;
    let cardElements = [];
    let currentCategory = "Tv1";

    dropdownToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    window.addEventListener("click", () => {
      dropdownMenu.classList.add("hidden");
    });

    dropdownItems.forEach(item => {
      item.addEventListener("click", (e) => {
        catButtons.forEach(b => b.classList.remove("active-btn"));
        dropdownToggleBtn.classList.remove("active-btn");
        
        currentCategory = e.currentTarget.getAttribute("data-cat");
        
        const targetBtn = document.querySelector(`.nav-btn[data-cat="${currentCategory}"]`);
        if (targetBtn) {
          targetBtn.classList.add("active-btn");
        } else {
          dropdownToggleBtn.classList.add("active-btn");
        }
        dropdownMenu.classList.add("hidden");
        filterAndRender();
      });
    });
    
    openJsonModalBtn.addEventListener("click", () => {
      dropdownMenu.classList.add("hidden");
      jsonModalOverlay.classList.remove("hidden");
      renderItemListManager();
    });

    closeJsonModalBtn.addEventListener("click", () => jsonModalOverlay.classList.add("hidden"));

    jsonCategorySelect.addEventListener("change", renderItemListManager);

    function renderItemListManager() {
      const selectedCat = jsonCategorySelect.value;
      const list = database[selectedCat] || [];
      itemListManager.innerHTML = "";

      if (list.length === 0) {
        itemListManager.innerHTML = `<span class="text-slate-500 text-[10px] text-center py-2">Bu kategoride kayıtlı öğe yok.</span>`;
        return;
      }

      list.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between bg-slate-900 px-2 py-1.5 rounded border border-slate-800 text-xs";
        row.innerHTML = `
          <span class="truncate text-slate-300 text-[11px] font-medium max-w-[200px]">${item.title}</span>
          <button onclick="deleteSingleItem('${selectedCat}', ${idx})" class="px-2 py-0.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded text-[10px] font-bold transition cursor-pointer">
            <i class="fa-solid fa-trash"></i> Sil
          </button>
        `;
        itemListManager.appendChild(row);
      });
    }

    window.deleteSingleItem = function(category, index) {
      database[category].splice(index, 1);
      if (category === "OzelListe") {
        localStorage.setItem("memoli_custom_ozel_liste", JSON.stringify(database["OzelListe"]));
      } else {
        localStorage.setItem(`memoli_custom_${category}`, JSON.stringify(database[category]));
      }
      renderItemListManager();
      filterAndRender();
    };

    jsonFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        jsonInputText.value = evt.target.result;
      };
      reader.readAsText(file);
    });
    
    saveJsonDataBtn.addEventListener("click", () => {
      try {
        const rawText = jsonInputText.value.trim();
        const targetCat = jsonCategorySelect.value;

        if (!rawText) {
          alert("Lütfen bir JSON dosyası seçin veya metin yapıştırın!");
          return;
        }
        const parsedData = JSON.parse(rawText);
        if (!Array.isArray(parsedData)) {
          alert("Hata: JSON verisi bir dizi (array '[...]') formatında olmalıdır!");
          return;
        }

        const formattedItems = parsedData.map((item, idx) => ({
          id: database[targetCat].length + idx + 1,
          title: item.title || item.name || "İsimsiz İçerik",
          category: targetCat,
          img: item.img || item.logo || "https://placehold.co/300x450/1e293b/ef4444?text=JSON",
          url: item.url || item.youtubeUrl || "#"
        }));

        database[targetCat] = database[targetCat].concat(formattedItems);
        
        if (targetCat === "OzelListe") {
          localStorage.setItem("memoli_custom_ozel_liste", JSON.stringify(database["OzelListe"]));
        } else {
          localStorage.setItem(`memoli_custom_${targetCat}`, JSON.stringify(database[targetCat]));
        }
        
        alert(`Başarıyla ${formattedItems.length} yeni kart "${targetCat}" kategorisine eklendi!`);
        jsonInputText.value = "";
        jsonFileInput.value = "";
        
        renderItemListManager();
        currentCategory = targetCat;
        catButtons.forEach(b => b.classList.remove("active-btn"));
        const targetBtn = document.querySelector(`.nav-btn[data-cat="${targetCat}"]`);
        if (targetBtn) targetBtn.classList.add("active-btn");
        
        filterAndRender();
      } catch (err) {
        alert("Geçersiz JSON formatı! Lütfen kontrol edin.\nHata: " + err.message);
      }
    });
    
    clearCustomDbBtn.addEventListener("click", () => {
      const targetCat = jsonCategorySelect.value;
      if (confirm(`"${targetCat}" kategorisindeki TÜM kayıtlı kartları silmek istediğinizden emin misiniz?`)) {
        database[targetCat] = [];
        if (targetCat === "OzelListe") {
          localStorage.removeItem("memoli_custom_ozel_liste");
        } else {
          localStorage.removeItem(`memoli_custom_${targetCat}`);
        }
        renderItemListManager();
        if (currentCategory === targetCat) filterAndRender();
      }
    });

    function parseM3UData(data, categoryKey) {
      const lines = data.split(/\r?\n/);
      let channels = [];
      let currentTitle = "İsimsiz Kanal";
      let currentLogo = "https://placehold.co/300x450/1e293b/e50914?text=TV";
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith("#EXTINF:")) {
          const logoMatch = line.match(/tvg-logo="([^"]*)"/);
          if (logoMatch && logoMatch[1]) {
            currentLogo = logoMatch[1];
          } else {
            currentLogo = "https://placehold.co/300x450/1e293b/e50914?text=TV";
          }
          const commaIdx = line.lastIndexOf(",");
          if (commaIdx !== -1) {
            currentTitle = line.substring(commaIdx + 1).trim();
          }
        } else if (line && !line.startsWith("#")) {
          channels.push({
            id: channels.length + 1,
            title: currentTitle,
            category: categoryKey,
            img: currentLogo,
            url: line
          });
          currentTitle = "İsimsiz Kanal";
          currentLogo = "https://placehold.co/300x450/1e293b/e50914?text=TV";
        }
      }
      if (database[categoryKey].length === 0) {
        database[categoryKey] = channels;
      }
      if (currentCategory === categoryKey) {
        filterAndRender();
      }
    }

    async function fetchTv1Channels() {

    function applyTheme(theme) {
      currentTheme = theme;
      if (theme === "dark") {
        document.body.classList.remove("light-theme");
        document.body.classList.add("dark-theme");
        themeDarkBtn.className = "py-2 px-3 rounded-lg font-black text-xs uppercase border border-red-600 bg-red-600/20 text-white flex items-center justify-center gap-1.5 cursor-pointer";
        themeLightBtn.className = "py-2 px-3 rounded-lg font-black text-xs uppercase border border-slate-700 bg-slate-800 text-slate-300 flex items-center justify-center gap-1.5 cursor-pointer";
      } else {
        document.body.classList.remove("dark-theme");
        document.body.classList.add("light-theme");
        themeLightBtn.className = "py-2 px-3 rounded-lg font-black text-xs uppercase border border-red-600 bg-red-600/20 text-red-600 flex items-center justify-center gap-1.5 cursor-pointer";
        themeDarkBtn.className = "py-2 px-3 rounded-lg font-black text-xs uppercase border border-slate-700 bg-slate-800 text-slate-300 flex items-center justify-center gap-1.5 cursor-pointer";
      }
      localStorage.setItem("memoli_theme", theme);
    }

    function applyPlayer(player) {
      currentPlayer = player;
      playerOptBtns.forEach(btn => {
        const p = btn.getAttribute("data-player");
        const icon = btn.querySelector(".check-icon");
        if (p === player) {
          btn.className = "player-opt-btn py-2 px-3 rounded-lg font-black text-xs uppercase border border-red-600 bg-red-600/20 text-white flex items-center justify-between cursor-pointer";
          icon.classList.remove("hidden");
        } else {
          btn.className = "player-opt-btn py-2 px-3 rounded-lg font-black text-xs uppercase border border-slate-700 bg-slate-800 text-slate-300 flex items-center justify-between cursor-pointer";
          icon.classList.add("hidden");
        }
      });
      localStorage.setItem("memoli_player", player);
    }

    themeDarkBtn.addEventListener("click", () => applyTheme("dark"));
    themeLightBtn.addEventListener("click", () => applyTheme("light"));
    playerOptBtns.forEach(btn => {
      btn.addEventListener("click", (e) => applyPlayer(e.currentTarget.getAttribute("data-player")));
    });
    
    settingsBtn.addEventListener("click", () => settingsOverlay.classList.remove("hidden"));
    closeSettingsBtn.addEventListener("click", () => settingsOverlay.classList.add("hidden"));
    saveSettingsBtn.addEventListener("click", () => settingsOverlay.classList.add("hidden"));

    function renderFilms(list) {
      filmGrid.innerHTML = "";
      if (list.length === 0) {
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");
      list.forEach((film, index) => {
        const card = document.createElement("div");
        card.className = "tv-card bg-card rounded-lg overflow-hidden cursor-pointer shadow-sm group flex flex-col items-center justify-center border-main h-15 p-1 relative";
        card.setAttribute("tabindex", "0");
        card.setAttribute("data-index", index);
        card.setAttribute("data-title", film.title);
        card.setAttribute("data-url", film.url);

        card.innerHTML = `
          <div class="w-full flex-1 flex items-center justify-center overflow-hidden p-1 relative">
            <img src="${film.img}"
                  loading="lazy"
                  onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200?text=TV'"
                  class="max-h-full max-w-full object-contain mx-auto my-auto group-hover:scale-105 transition duration-200">
          </div>
          <div class="w-full flex items-center justify-center pt-1 border-t border-main/50">
            <h2 class="font-bold text-[10px] text-main truncate text-center uppercase w-full px-1">
              ${film.title}
            </h2>
          </div>`;
          
        card.addEventListener("mouseenter", () => setFocus(index));
        card.addEventListener("click", () => openChannel(film.url, film.title));
        filmGrid.appendChild(card);
      });
      cardElements = document.querySelectorAll(".tv-card");
      if (cardElements.length > 0) setFocus(0);
    }

    function setFocus(index) {
      if (index < 0 || index >= cardElements.length) return;
      cardElements.forEach(c => c.classList.remove("tv-focused"));
      currentIndex = index;
      const target = cardElements[currentIndex];
      target.classList.add("tv-focused");
      target.focus();
      target.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
      activeTitle.textContent = `Seçili: ${target.getAttribute("data-title")}`;
    }

    // YOUTUBE LINK PARSER
    function extractYouTubeId(url) {
      if (!url) return null;
      let cleanUrl = url.trim();
      if (cleanUrl.includes('embed/')) {
        return cleanUrl.split('embed/')[1].split('?')[0].split('&')[0];
      }
      if (cleanUrl.includes('v=')) {
        return cleanUrl.split('v=')[1].split('&')[0];
      }
      if (cleanUrl.includes('youtu.be/')) {
        return cleanUrl.split('youtu.be/')[1].split('?')[0];
      }
      if (cleanUrl.includes('shorts/')) {
        return cleanUrl.split('shorts/')[1].split('?')[0];
      }
      return null;
    }

    // KANAL / İÇERİK OYNATMA FONKSİYONU
    function openChannel(url, title = "İçerik") {
      if (!url || url === "#") return;

      if (currentPlayer === "browser") {
        window.open(url, "_blank");
      } else if (currentPlayer === "external") {
        window.location.href = "intent://" + url.replace(/^https?:\/\//, '') + "#Intent;scheme=https;type=video/*;end";
      } else {
        // İster iframe seçilsin ister hls, içerik türüne göre akıllı oynatma:
        playInInternalPlayer(url, title);
      }
    }

    // AKILLI OYNATICI (YOUTUBE -> İFRAME | CANLI/M3U -> HLS PLAYER)
    function playInInternalPlayer(url, title) {
      playerModalTitle.textContent = title;
      playerModalOverlay.classList.remove("hidden");

      // Önceki oynatıcıları temizle
      internalVideoPlayer.pause();
      internalVideoPlayer.src = "";
      internalYoutubePlayer.src = "";
      internalVideoPlayer.classList.add("hidden");
      internalYoutubePlayer.classList.add("hidden");
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      const ytId = extractYouTubeId(url);

      if (ytId) {
        // YouTube İse Her Zaman İframe'de Aç
        internalYoutubePlayer.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&enablejsapi=1`;
        internalYoutubePlayer.classList.remove("hidden");
      } else {
        // TRT 1, Canlı Yayınlar veya Diğer Video Linkleri (.m3u8 vb.) Video Elementi ve HLS ile Açılır
        internalVideoPlayer.classList.remove("hidden");
        if (url.includes(".m3u8")) {
          if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(internalVideoPlayer);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
              internalVideoPlayer.play().catch(e => console.log("Oynatma hatası:", e));
            });
          } else if (internalVideoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
            internalVideoPlayer.src = url;
            internalVideoPlayer.play().catch(e => console.log("Oynatma hatası:", e));
          }
        } else {
          internalVideoPlayer.src = url;
          internalVideoPlayer.play().catch(e => console.log("Oynatma hatası:", e));
        }
      }
    }
    
    function closeInternalPlayer() {
      playerModalOverlay.classList.add("hidden");
      internalVideoPlayer.pause();
      internalVideoPlayer.src = "";
      internalYoutubePlayer.src = "";
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    closePlayerModalBtn.addEventListener("click", closeInternalPlayer);

    const catButtons = document.querySelectorAll(".nav-btn");
    catButtons.forEach(btn => {
      btn.addEventListener("click", (e) => {
        catButtons.forEach(b => b.classList.remove("active-btn"));
        dropdownToggleBtn.classList.remove("active-btn");
        e.currentTarget.classList.add("active-btn");
        currentCategory = e.currentTarget.getAttribute("data-cat");
        filterAndRender();
      });
    });
     
    searchInput.addEventListener("input", filterAndRender);

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !playerModalOverlay.classList.contains("hidden")) {
        closeInternalPlayer();
        e.preventDefault();
        return;
      }

      if (document.activeElement === searchInput) {
        if (e.key === "ArrowDown") {
          searchInput.blur();
          setFocus(0);
          e.preventDefault();
        }
        return;
      }

      if (!playerModalOverlay.classList.contains("hidden")) return;

      const cols = window.innerWidth >= 1536 ? 8 : window.innerWidth >= 1280 ? 7 : window.innerWidth >= 768 ? 6 : 3;
      let newIdx = currentIndex;
      switch (e.key) {
        case "ArrowRight":
          newIdx = currentIndex + 1;
          if (newIdx < cardElements.length) { setFocus(newIdx); e.preventDefault(); }
          break;
        case "ArrowLeft":
          newIdx = currentIndex - 1;
          if (newIdx >= 0) { setFocus(newIdx); e.preventDefault(); }
          break;
        case "ArrowDown":
          newIdx = currentIndex + cols;
          if (newIdx < cardElements.length) { setFocus(newIdx); e.preventDefault(); }
          break;
        case "ArrowUp":
          newIdx = currentIndex - cols;
          if (newIdx >= 0) {
            setFocus(newIdx);
            e.preventDefault();
          } else {
            searchInput.focus();
            cardElements.forEach(c => c.classList.remove("tv-focused"));
            activeTitle.textContent = "Arama Çubuğu";
            e.preventDefault();
          }
          break;
        case "Enter":
        case "Ok":
        case "Select":
          e.preventDefault();
          const activeCard = cardElements[currentIndex];
          if (activeCard) openChannel(activeCard.getAttribute("data-url"), activeCard.getAttribute("data-title"));
          break;
      }
    });

    function filterAndRender() {
      const query = searchInput.value.toLowerCase().trim();
      const currentList = database[currentCategory] || [];
      const filtered = currentList.filter(item => item.title.toLowerCase().includes(query));
      renderFilms(filtered);
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const clockElement = document.getElementById('liveClock');
      if (clockElement) {
        clockElement.textContent = `${hours}:${minutes}:${seconds}`;
      }
    }
    setInterval(updateClock, 1000);

    window.onload = function() {
      applyTheme(currentTheme);
      applyPlayer(currentPlayer);
      fetchTv1Channels();
      fetchTv2Channels();
      fetchFilmler();
      fetchDiziler();
      fetchRadyo();
      fetchDogaResimleri();
      fetchDogaVideolari();
      filterAndRender();
      updateClock();
    };
  </script>
